<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <!--
        Permite que la interfaz responda correctamente
        en celulares y tablets.
    -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="{% block meta_description %}SULPAA: kombucha artesanal, tienda, pedidos y contenido educativo.{% endblock %}"
    >

    <!--
        Cada página hija puede definir su propio título.
    -->
    <title>
        {% block title %}
            SULPAA
        {% endblock %}
    </title>


    <!-- =====================================================
         CSS GLOBAL
         ===================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/main.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/components.css') }}"
    >

    <!--
        Carrito lateral reutilizable.

        Se carga en TODAS las páginas para que el panel siempre
        empiece oculto y con el mismo aspecto, incluso donde no
        se carga store.css (Inicio, Aprende, Mis pedidos...).
    -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/components/cart.css') }}"
    >


    <!--
        Cada página podrá cargar CSS propio
        sin duplicar estilos globales.
    -->
    {% block page_css %}
    {% endblock %}

</head>


<body>

    <!-- =====================================================
         CONTENIDO PRINCIPAL
         ===================================================== -->

    {% block content %}
    {% endblock %}


    <!-- =====================================================
         JAVASCRIPT GLOBAL
         ===================================================== -->

    <script
        src="{{ url_for('static', filename='js/main.js') }}"
    ></script>


    <!--
        Carrito lateral reutilizable.

        Se carga en todas las páginas, pero solo se activa
        cuando la página incluye el componente del carrito
        (todos los que muestran el navbar del cliente).
    -->
    <script
        src="{{ url_for('static', filename='js/modules/cart.js') }}"
        defer
    ></script>


    <!--
        Espacio para scripts exclusivos de una página.
    -->
    {% block page_js %}
    {% endblock %}

</body>

</html>
